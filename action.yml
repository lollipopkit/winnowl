name: winnowl review
description: Run winnowl's review of this pull request in GitHub Actions, with your own model key. winnowl publishes the result.
branding:
  icon: check-circle
  color: purple

inputs:
  llm-api-key:
    description: API key for your model provider. Store it as a repository secret.
    required: true
  llm-base-url:
    description: OpenAI-compatible endpoint; empty uses the provider's default endpoint.
    required: false
    default: ''
  llm-provider:
    description: Provider id (openai, anthropic, deepseek, openrouter, ...); empty keeps the server's choice.
    required: false
    default: ''
  llm-model:
    description: One model for every review stage; empty keeps the server's models, so your endpoint must serve them.
    required: false
    default: ''
  llm-template-model:
    description: A known model to copy limits and pricing from when llm-model is not in the catalog.
    required: false
    default: ''
  exa-api-key:
    description: Optional key for web search during review.
    required: false
    default: ''
  context7-api-key:
    description: Optional key for library documentation lookups during review.
    required: false
    default: ''
  api-url:
    description: winnowl API; change it only for a self-hosted deployment.
    required: false
    default: https://winnowl-api.lollipopkit.com
  claim-timeout:
    description: Seconds to wait for winnowl to prepare the review.
    required: false
    default: '600'

runs:
  using: composite
  steps:
    - name: Check out the pull request head
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: .winnowl-worktree
        persist-credentials: false
        fetch-depth: 1

    - name: Review
      shell: bash
      env:
        WINNOWL_API_URL: ${{ inputs.api-url }}
        WINNOWL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        WINNOWL_CLAIM_TIMEOUT_S: ${{ inputs.claim-timeout }}
        LLM_API_KEY: ${{ inputs.llm-api-key }}
        LLM_BASE_URL: ${{ inputs.llm-base-url }}
        LLM_PROVIDER: ${{ inputs.llm-provider }}
        LLM_MODEL: ${{ inputs.llm-model }}
        LLM_TEMPLATE_MODEL: ${{ inputs.llm-template-model }}
        EXA_API_KEY: ${{ inputs.exa-api-key }}
        CONTEXT7_API_KEY: ${{ inputs.context7-api-key }}
      run: |
        set -euo pipefail
        if [ -z "${WINNOWL_HEAD_SHA}" ]; then
          echo "::error::winnowl reviews pull requests: run this action on a pull_request event"
          exit 1
        fi
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::no OIDC token: add 'permissions: id-token: write' to the workflow (pull requests from forks never get one)"
          exit 1
        fi
        api="${WINNOWL_API_URL%/}"
        image="$(curl -fsS --retry 3 "${api}/v1/actions/executor" | jq -r .image)"
        echo "executor image: ${image}"
        # CI publishes the image a few minutes after a server deploy; wait for it rather than run a mismatched one.
        for i in $(seq 1 20); do
          if docker pull --quiet "${image}" >/dev/null; then break; fi
          if [ "$i" = 20 ]; then echo "::error::could not pull ${image}"; exit 1; fi
          sleep 30
        done

        # Review commands run on this host as a separate user: no sudo, no docker, no access to this
        # user's processes (job tokens, model key) or to the workspace; only with passwordless sudo.
        cmd_args=()
        # One account per invocation, so cleanup never touches another job's commands on a shared host.
        cmd_user="wnl-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
        cmd_user_made=0
        host_pid=""
        work=""
        restore=()
        # Safe at any point of the setup: each step undoes only what was done.
        cleanup() {
          if [ -n "$host_pid" ]; then kill "$host_pid" 2>/dev/null || true; fi
          if [ "$cmd_user_made" = 1 ]; then sudo -n pkill -KILL -u "$cmd_user" 2>/dev/null || true; fi
          for r in "${restore[@]}"; do chmod "${r%% *}" "${r#* }" || true; done
          if [ -n "$work" ]; then sudo -n rm -rf "$work" || true; fi
          if [ "$cmd_user_made" = 1 ]; then sudo -n userdel -r "$cmd_user" 2>/dev/null || true; fi
        }
        setup_commands() {
          sudo -n useradd --create-home --shell /bin/bash "$cmd_user" || return 1
          cmd_user_made=1
          work="$(mktemp -d /tmp/winnowl-work.XXXXXX)" || return 1
          cp -a .winnowl-worktree/. "$work/" || return 1
          sudo -n chown -R "$cmd_user:" "$work" || return 1
          sock_dir="$(mktemp -d "${RUNNER_TEMP}/winnowl-cmd.XXXXXX")" || return 1
          for d in "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; do
            mode="$(stat -c %a "$d")" || return 1
            chmod o-rwx "$d" || return 1
            restore+=("$mode $d")
          done
          node "${GITHUB_ACTION_PATH}/action/command-host.mjs" "$sock_dir/cmd.sock" "$work" "$cmd_user" &
          host_pid=$!
          for i in $(seq 1 50); do [ -S "$sock_dir/cmd.sock" ] && break; sleep 0.1; done
          [ -S "$sock_dir/cmd.sock" ] || return 1
          cmd_args=(-v "${sock_dir}:/winnowl-cmd" -e WINNOWL_COMMAND_SOCKET=/winnowl-cmd/cmd.sock)
        }
        if sudo -n true 2>/dev/null && command -v node >/dev/null; then
          trap cleanup EXIT
          if setup_commands; then
            if ! sudo -n -u "$cmd_user" test -x "$HOME"; then
              echo "::notice::toolchains installed under ${HOME} (for example rustup) are not available to review commands"
            fi
          else
            echo "::warning::review commands could not be set up; this review runs no commands"
            cleanup
            trap - EXIT
            cmd_args=()
          fi
        fi
        docker run --rm \
          -v "${GITHUB_WORKSPACE}/.winnowl-worktree:/worktree:ro" \
          -e WORKTREE_PATH=/worktree \
          "${cmd_args[@]}" \
          -e GITHUB_REPOSITORY \
          -e WINNOWL_API_URL -e WINNOWL_HEAD_SHA -e WINNOWL_CLAIM_TIMEOUT_S \
          -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
          -e LLM_API_KEY -e LLM_BASE_URL -e LLM_PROVIDER -e LLM_MODEL -e LLM_TEMPLATE_MODEL \
          -e EXA_API_KEY -e CONTEXT7_API_KEY \
          "${image}" node apps/review-executor/dist/actions.mjs
