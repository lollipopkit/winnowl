name: Docker publish

# 构建两镜像(backend + web)推 ghcr.io。deploy/Dockerfile 多阶段:
#   reviewbot(target backend:三应用)、reviewbot-web(target web:nginx + SPA)。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推 ghcr.io 需要
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: reviewbot
            target: backend
          - image: reviewbot-web
            target: web
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需全历史 + tags 以按 gtp 逻辑算版本

      # 版本号:对齐 fish `gtp`(git_tag_push)自动逻辑——
      # 取最新 tag vX.Y.Z,新版本 = vX.Y.(Z + 自该 tag 起的 commit 数);无 tag 则 v0.0.(HEAD commit 总数)。
      # tag 推送(git describe 命中该 tag,commit 数=0)时即等于该 tag,一致。
      - name: Compute version(gtp 逻辑)
        id: version
        run: |
          set -euo pipefail
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          ver=${latest#v}
          major=${ver%%.*}; rest=${ver#*.}; minor=${rest%%.*}; patch=${rest#*.}
          patch=${patch%%[^0-9]*}   # 去掉任何 -pre 等后缀
          if [ "$latest" = "v0.0.0" ]; then
            commits=$(git rev-list --count HEAD)
          else
            commits=$(git rev-list --count "${latest}..HEAD")
          fi
          version="v${major}.${minor}.$((patch + commits))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "computed version: $version (base $latest + $commits commits)"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata(tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: . # 仓库根(Dockerfile COPY packages/apps/…)
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          # 单 arch(amd64)构建快;需 arm64 加 linux/arm64(QEMU,较慢)。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
