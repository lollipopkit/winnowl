global:
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: winnowl-control-api
    # /metrics requires Bearer METRICS_TOKEN.
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['control-api:8080']
  - job_name: winnowl-webhook-ingress
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['webhook-ingress:8081', 'webhook-ingress-b:8081']
  - job_name: winnowl-runner-supervisor
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      # Separate metrics port (METRICS_PORT, default 9464).
      - targets: ['runner-supervisor:9464']
  - job_name: winnowl-sandbox-agent
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    # Written by scripts/deploy-live.sh.
    file_sd_configs:
      - files: ['/etc/prometheus/sandbox-agents.json']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
