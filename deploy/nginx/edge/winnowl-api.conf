# Installed as sites-enabled/winnowl-api.conf on the API host's shared nginx proxy.

# Retrying a POST on the other instance is safe: ingestion dedupes on the delivery id.
upstream winnowl_webhook_ingress {
    server host.docker.internal:8081 max_fails=1 fail_timeout=10s;
    server host.docker.internal:8082 max_fails=1 fail_timeout=10s;
}

# Origin must only be reachable through Cloudflare.
# TODO: refresh from https://www.cloudflare.com/ips-v4 and /ips-v6 periodically.
geo $realip_remote_addr $winnowl_from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name winnowl-api.lollipopkit.com;

    ssl_certificate /etc/letsencrypt/live/lollipopkit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lollipopkit.com/privkey.pem;

    include /etc/nginx/snippets/cloudflare-realip.conf;
    if ($winnowl_from_cloudflare = 0) {
        return 403;
    }

    # GitHub caps webhook payloads at 25 MB.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Progress streams (SSE) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 300s;

    location /webhooks/ {
        proxy_pass http://winnowl_webhook_ingress;
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
    }
    location / {
        proxy_pass http://host.docker.internal:8080;
    }
}
