# Single public port: serves the SPA and proxies /v1 and /webhooks to the backends.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;

  # Variable proxy_pass + docker DNS resolves per request, so recreated backends with new IPs need no reload.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $control_api control-api:8080;
  set $webhook_ingress webhook-ingress:8081;

  # Includes /v1/auth/*, so the session cookie is same-origin with the SPA.
  location /v1/ {
    proxy_pass http://$control_api;
    proxy_set_header Host $host;
  }
  location /health {
    proxy_pass http://$control_api;
    proxy_set_header Host $host;
  }
  location /webhooks/ {
    proxy_pass http://$webhook_ingress;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  # The landing page is prerendered as index.html; the SPA shell fallback is 200.html so it does not replace it.
  location / {
    try_files $uri $uri/ @spa;
  }
  # App routes share one shell; noindex as a header because crawlers without JS never see the in-page tag.
  location @spa {
    add_header X-Robots-Tag "noindex" always;
    try_files /200.html =404;
  }
}
